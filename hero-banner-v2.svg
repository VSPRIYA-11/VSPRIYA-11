<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04010a"/>
      <stop offset="55%" stop-color="#0a0114"/>
      <stop offset="100%" stop-color="#12021f"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D75CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- subtle corner HUD accents -->
  <g stroke="#B026FF" stroke-opacity="0.55" stroke-width="2" fill="none">
    <polyline points="30,20 30,50 60,50"/>
    <polyline points="1170,20 1170,50 1140,50"/>
    <polyline points="30,200 30,170 60,170"/>
    <polyline points="1170,200 1170,170 1140,170"/>
  </g>

  <!-- name: purple glow halo behind -->
  <text x="600" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="58" letter-spacing="2" fill="#B026FF" filter="url(#glow)">
    SHANMUGA PRIYA V
    <animate attributeName="opacity" values="1;0.75;1" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- name: crisp white core on top -->
  <text x="600" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="58" letter-spacing="2" fill="#FFFFFF">
    SHANMUGA PRIYA V
    <animate attributeName="opacity" values="1;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle: purple glow halo -->
  <text x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="21" letter-spacing="3" fill="#B026FF" filter="url(#softGlow)" opacity="0.9">
    AI/ML &#8226; DATA SCIENCE &#8226; SOFTWARE DEVELOPMENT
  </text>

  <!-- subtitle: crisp white core -->
  <text x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="21" letter-spacing="3" fill="#FFFFFF">
    AI/ML &#8226; DATA SCIENCE &#8226; SOFTWARE DEVELOPMENT
  </text>

  <!-- glowing underline -->
  <rect x="300" y="178" width="600" height="3" fill="url(#lineGrad)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
